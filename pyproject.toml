[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "minecraft-skin-toolkit"
version = "0.1.0"
description = "Local Minecraft skin authoring, validation, and previews for agents"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["Pillow>=11,<13", "mcp>=1,<2"]

[project.scripts]
minecraft-skin = "minecraft_skin_toolkit.cli:main"
minecraft-skin-mcp = "minecraft_skin_toolkit.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/minecraft_skin_toolkit"]
